      VALUES('Chocolate Cake','A rich and moist chocolate cake for special occasions.','8
      servings','45 mins','','flour, cocoa, sugar, eggs, butter','Mix dry ingredients.
      Add wet ingredients. Bake at 350F for 30 mins.',0);"
