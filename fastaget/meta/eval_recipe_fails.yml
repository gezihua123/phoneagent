cases:
- goal: Add the recipes from recipes.jpg in Simple Gallery Pro to the Broccoli recipe
    app.
  initialize:
  - command: sqlite3 /data/data/com.flauschcode.broccoli/databases/broccoli "DELETE
      FROM recipes;"
  - command: am force-stop com.flauschcode.broccoli 2>/dev/null || true
  max_steps: 30
  name: AW-RecipeAddMultipleRecipesFromImage
  tags:
  - H
  - broccoli
  - T4
  verify:
  - command: sqlite3 /data/data/com.flauschcode.broccoli/databases/broccoli "SELECT
      COUNT(*) FROM recipes;"
    expect_re: '[1-9][0-9]*'
- goal: Delete all but one of any recipes in the Broccoli app that are exact duplicates,
    ensuring at least one instance of each unique recipe remains
  initialize:
  - command: sqlite3 /data/data/com.flauschcode.broccoli/databases/broccoli "DELETE
      FROM recipes;"
  - command: sqlite3 /data/data/com.flauschcode.broccoli/databases/broccoli "INSERT
      INTO recipes(title,description,servings,preparationTime,source,ingredients,directions,favorite)
      VALUES('Avocado Toast with Egg','A delicious and healthy choice for any time
      of the day.','1 serving','10 mins','','as per recipe','Toast bread, top with
      mashed avocado, a fried egg, salt, pepper, and chili flakes. Garnish with fresh
      herbs for a more vibrant taste.',0);"
  - command: sqlite3 /data/data/com.flauschcode.broccoli/databases/broccoli "INSERT
      INTO recipes(title,description,servings,preparationTime,source,ingredients,directions,favorite)
      VALUES('Greek Salad Pita Pockets','An ideal recipe for experimenting with different
      flavors and ingredients.','3-4 servings','30 mins','','to preference','Fill
      pita pockets with lettuce, cucumber, tomato, feta, olives, and Greek dressing.
      Feel free to substitute with ingredients you have on hand.',0);"
