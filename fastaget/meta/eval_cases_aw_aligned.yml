cases:
- goal: Record an audio clip using Audio Recorder app and save it.
  initialize:
  - command: rm -rf /storage/emulated/0/Android/data/com.dimowner.audiorecorder/files/Music/records/* 2>/dev/null || true
  - command: mkdir -p /storage/emulated/0/Android/data/com.dimowner.audiorecorder/files/Music/records
  max_steps: 20
  name: AW-AudioRecorderRecordAudio
  tags:
  - E
  - audio_recorder
  - T4
  verify:
  - command: find /storage/emulated/0/Android/data/com.dimowner.audiorecorder/files/Music/records -type f -size +0c 2>/dev/null | wc -l
    expect: '1'
- goal: Record an audio clip and save it with name "test_note_plxw.m4a" using Audio Recorder app.
  initialize:
  - command: rm -rf /storage/emulated/0/Android/data/com.dimowner.audiorecorder/files/Music/records/* 2>/dev/null || true
  - command: mkdir -p /storage/emulated/0/Android/data/com.dimowner.audiorecorder/files/Music/records
  max_steps: 15
  name: AW-AudioRecorderRecordAudioWithFileName
  tags:
  - E
  - audio_recorder
  - T4
  verify:
  - command: find /storage/emulated/0/Android/data/com.dimowner.audiorecorder/files/Music/records -name 'test_note_plxw.m4a*' 2>/dev/null | wc -l
    expect: '1'
- goal: Open the file task.html in Downloads in the file manager; when prompted open it with Chrome. Then create a drawing using the three colors shown at the top and hit submit.
  initialize:
  - command: mkdir -p /sdcard/Download 2>/dev/null || true
  - command: adb push fastaget/meta/assets/aw_browser_draw.html /sdcard/Download/task.html
  max_steps: 25
  name: AW-BrowserDraw
  tags:
  - E
  - browser
  - T5
  verify:
  - command: dumpsys activity activities | grep topResumedActivity
    expect_re: chrome|browser
  - command: ''
    ui_contains: Success!
- goal: Open the file task.html in Downloads in the file manager; when prompted open it with Chrome. Then navigate the X to the bottom-right cell, by using the direction buttons.
  initialize:
  - command: mkdir -p /sdcard/Download 2>/dev/null || true
  - command: adb push fastaget/meta/assets/aw_browser_maze.html /sdcard/Download/task.html
  max_steps: 25
  name: AW-BrowserMaze
  tags:
  - E
  - browser
  - T5
  verify:
  - command: dumpsys activity activities | grep topResumedActivity
    expect_re: chrome|browser
  - command: ''
    ui_contains: Success!
- goal: Open the file task.html in Downloads in the file manager; when prompted open it with Chrome. Then click the button 5 times, remember the numbers displayed, and enter their product in the form.
  initialize:
  - command: mkdir -p /sdcard/Download 2>/dev/null || true
  - command: adb push fastaget/meta/assets/aw_browser_multiply.html /sdcard/Download/task.html
  max_steps: 30
  name: AW-BrowserMultiply
  tags:
  - H
  - browser
  - T5
  verify:
  - command: dumpsys activity activities | grep topResumedActivity
    expect_re: chrome|browser
  - command: ''
    ui_contains: Success!
- goal: Open the Camera app (com.android.camera2) and take one photo.
  initialize:
  - command: rm -rf /sdcard/Pictures/*.jpg /sdcard/DCIM/Camera/*.jpg 2>/dev/null || true
  - command: rm -rf /sdcard/Pictures/.thumbnails 2>/dev/null || true
  max_steps: 20
  name: AW-CameraTakePhoto
  precondition:
  - check: '{device.pkg_installed:com.android.camera2}'
    description: 相机应用已安装
    severity: critical
  tags:
  - E
  - camera
  - T1
  verify:
  - command: find /sdcard/Pictures -maxdepth 1 -name '*.jpg' 2>/dev/null | wc -l
    expect: '1'
- goal: Open the Camera app (com.android.camera2), switch to video mode, and take one video.
  initialize:
  - command: rm -rf /sdcard/Movies 2>/dev/null || true
  - command: mkdir -p /sdcard/Movies
  max_steps: 20
  name: AW-CameraTakeVideo
  precondition:
  - check: '{device.pkg_installed:com.android.camera2}'
    description: 相机应用已安装
    severity: critical
  - check: '{screen.not_has_text:While using the app}'
    description: 前台再无障碍弹窗
    severity: warn
  tags:
  - M
  - camera
  - T1
  verify:
  - command: find /sdcard/Movies -maxdepth 1 -type f -not -name '.*' 2>/dev/null | wc -l
    expect: '1'
- goal: Open the Clock app (com.google.android.deskclock), go to Stopwatch tab, and pause the stopwatch.
  initialize:
  - command: pm clear com.google.android.deskclock 2>/dev/null || true
  max_steps: 10
  name: AW-ClockStopWatchPausedVerify
  tags:
  - E
  - clock
  - T2
  verify:
  - command: dumpsys activity activities | grep topResumedActivity
    expect_re: '[Dd]esk[Cc]lock'
  - command: ''
    ui_contains: desc="Start"
  - command: ''
    ui_contains: text="Stopwatch" id="action_bar_title"
- goal: Open the Clock app (com.google.android.deskclock), go to Stopwatch tab, and run the stopwatch.
  initialize:
  - command: pm clear com.google.android.deskclock 2>/dev/null || true
  max_steps: 9
  name: AW-ClockStopWatchRunning
  tags:
  - E
  - clock
  - T2
  verify:
  - command: dumpsys activity activities | grep topResumedActivity
    expect_re: '[Dd]esk[Cc]lock'
  - command: ''
    ui_contains: desc="Pause"
  - command: ''
    ui_contains: desc="Lap"
- goal: Open the Clock app (com.google.android.deskclock), go to Timer tab, create a timer with 0 hours, 5 minutes, and 0 seconds. Do not start the timer.
  initialize:
  - command: pm clear com.google.android.deskclock 2>/dev/null || true
  max_steps: 9
  name: AW-ClockTimerEntry
  tags:
  - E
  - clock
  - T2
  verify:
  - command: dumpsys activity activities | grep topResumedActivity
    expect_re: '[Dd]esk[Cc]lock'
  - command: ''
    ui_contains: 0 hours, 5 minutes, 0 seconds
- goal: Open the Contacts app (com.google.android.contacts), create a new contact for Alice Smith. Their number is 555-0100.
  initialize:
  - command: pm clear com.android.providers.contacts 2>/dev/null || true
  max_steps: 15
  name: AW-ContactsAddContact
  tags:
  - E
  - contacts
  - T3
  verify:
  - command: content query --uri content://contacts/phones/ --projection display_name:number 2>/dev/null || echo NO_CONTACT
    expect_re: Alice Smith
  - command: content query --uri content://contacts/phones/ --projection display_name:number 2>/dev/null | tr -dc '0-9'
    expect_re: '5550100'
- goal: 'Open the Contacts app (com.google.android.contacts), go to the new contact screen and enter: First Name: Alice, Last Name: Smith, Phone: 555-0100, Phone Label: Home. Do NOT hit save.'
  initialize:
  - command: pm clear com.android.providers.contacts 2>/dev/null || true
  max_steps: 15
  name: AW-ContactsNewContactDraft
  tags:
  - E
  - contacts
  - T2
  verify:
  - command: ''
    ui_contains: text="Alice"
  - command: ''
    ui_contains: text="Smith"
  - command: ''
    ui_contains: text="555-0100"
  - command: ''
    ui_contains: desc="Home Phone"
  - command: content query --uri content://contacts/phones/ --projection display_name:number 2>/dev/null || echo NO_CONTACT
    not_contain: Alice Smith
