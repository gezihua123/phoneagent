    expect: '1697727600'
  - command: sqlite3 /data/data/com.simplemobiletools.calendar.pro/databases/events.db "SELECT description FROM events WHERE title='Test Meeting';" 2>/dev/null
    expect: Automated test event
  - command: sqlite3 /data/data/com.simplemobiletools.calendar.pro/databases/events.db "SELECT COUNT(*) FROM events;" 2>/dev/null
    expect: '1'
