- goal: Turn off WiFi, then enable bluetooth
  initialize:
  - command: svc wifi enable
  - command: svc bluetooth disable
  max_steps: 10
  name: AW-TurnOffWifiAndTurnOnBluetooth
  tags:
  - M
  - system
  - T3
  verify:
  - command: settings get global wifi_on
    expect: '0'
  - command: settings get global bluetooth_on
    expect: '1'
- goal: Turn on Wifi, then open the Settings app (com.android.settings). Clear any pop-ups that may appear by granting all permissions that are required.
  initialize:
  - command: svc wifi disable
  max_steps: 13
  name: AW-TurnOnWifiAndOpenApp
  tags:
  - E
  - system
  - T3
  verify:
  - command: settings get global wifi_on
    expect_re: '[12]'
  - command: dumpsys activity activities | grep topResumedActivity
    expect_re: settings
- goal: 'Create a playlist titled "Test Playlist wjj" with the following files in VLC (located in Internal Memory/VLCVideos), in order: test_video_1.mp4, test_video_2.mp4, test_video_3.mp4'
  initialize:
  - command: am force-stop org.videolan.vlc 2>/dev/null || true
  - command: rm -f /data/data/org.videolan.vlc/app_db/vlc_media.db 2>/dev/null || true
  - command: mkdir -p /sdcard/VLCVideos 2>/dev/null || true
  - command: rm -f /sdcard/VLCVideos/*.mp4 2>/dev/null || true
  - command: adb push fastaget/meta/assets/aw_vlc_test_video_1.mp4 /sdcard/VLCVideos/test_video_1.mp4
  - command: adb push fastaget/meta/assets/aw_vlc_test_video_2.mp4 /sdcard/VLCVideos/test_video_2.mp4
  - command: adb push fastaget/meta/assets/aw_vlc_test_video_3.mp4 /sdcard/VLCVideos/test_video_3.mp4
  - command: adb push fastaget/meta/assets/aw_vlc_other_video_1.mp4 /sdcard/VLCVideos/other_video_1.mp4
  - command: adb push fastaget/meta/assets/aw_vlc_other_video_2.mp4 /sdcard/VLCVideos/other_video_2.mp4
  - command: am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///storage/emulated/0/VLCVideos 2>/dev/null || true
  - command: am force-stop org.videolan.vlc 2>/dev/null || true
  max_steps: 25
  name: AW-VlcCreatePlaylist
  tags:
  - M
  - vlc
  - T4
  verify:
  - command: sqlite3_cat:/data/data/org.videolan.vlc/app_db/vlc_media.db::SELECT COUNT(*) FROM Playlist WHERE name='Test Playlist wjj';
    expect: '1'
  - command: sqlite3_cat:/data/data/org.videolan.vlc/app_db/vlc_media.db::SELECT Playlist.name, Media.filename, PlaylistMediaRelation.position FROM PlaylistMediaRelation INNER JOIN Playlist ON Playlist.id_playlist
      = PlaylistMediaRelation.playlist_id INNER JOIN Media ON Media.id_media = PlaylistMediaRelation.media_id WHERE Playlist.name='Test Playlist wjj' ORDER BY Playlist.name, PlaylistMediaRelation.position;
    expect_re: ^Test\ Playlist\ wjj\|test_video_1\.mp4\|0\s*\nTest\ Playlist\ wjj\|test_video_2\.mp4\|1\s*\nTest\ Playlist\ wjj\|test_video_3\.mp4\|2\s*$
