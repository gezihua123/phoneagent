      com.simplemobiletools.calendar.pro 2>/dev/null; fi
  - command: sqlite3 /data/data/com.simplemobiletools.calendar.pro/databases/events.db "DELETE FROM events;" 2>/dev/null || true
  max_steps: 30
  name: AW-SimpleCalendarAddOneEventRelativeDay
  tags:
  - E
  - calendar
  - T3
