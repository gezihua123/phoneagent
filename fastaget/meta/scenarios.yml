# ---------------------------------------------------------------------------
# 二、屏幕变体（从 wd4.xml 派生）
# ---------------------------------------------------------------------------
variants:
  baseline:
    desc: "原始设置页"
  bt_off:
    desc: "蓝牙开关已关闭（checked=false）"
    transform: set_attr
    target: "蓝牙开关"
    attr: checked
    value: "false"
  loc_off:
    desc: "位置开关已关闭"
    transform: set_attr
    target: "位置信息开关"
    attr: checked
    value: "false"
  scrolled:
    desc: "整体下移 200px（模拟滚动）"
    transform: shift
    dy: 200
  truncated:
    desc: "删除「存储」节点（模拟未完全加载）"
    transform: strip
    target: "存储"
  noisy:
    desc: "添加 5 个噪声元素"
    transform: noise
    count: 5


# ---------------------------------------------------------------------------
# 三、测试场景（开始 / 期望）
# ---------------------------------------------------------------------------
scenarios:

  - name: toggle_bluetooth
    goal: "关闭蓝牙开关"
    start: settings_home
    expect: "蓝牙开关从开启变为关闭，屏幕显示'已关闭'。不应进入蓝牙详情页。"

  - name: toggle_location
    goal: "关闭位置信息开关"
    start: settings_home
    expect: "位置信息开关从开启变为关闭，屏幕显示'已关闭'。不应进入位置详情页。"

  - name: go_to_battery
    goal: "进入电池设置页面"
    start: settings_home
    expect: "屏幕跳转到电池设置页，标题显示'电池'。"

  - name: go_back
    goal: "返回上一页"
    start: bt_off
    expect: "屏幕从蓝牙页返回到设置首页。"

  - name: self_heal_bluetooth
    goal: "关闭蓝牙开关"
    start: settings_home
    expect: "蓝牙开关从开启变为关闭。过程中可能出现 index 错误但应自愈重选。"

  - name: frozen_loading
    goal: "关闭蓝牙开关"
    start: loading
    expect: "屏幕处于加载中状态，agent 应识别无法操作并主动结束（标记失败）。"

  - name: empty_screen
    goal: "关闭蓝牙开关"
    start: empty
    expect: "屏幕无任何可交互元素，agent 应识别无法操作并主动结束（标记失败）。"

  # ---- 状态感知：开关已关，agent 不应再点（点了会重开）----
  - name: verify_bluetooth_off
    goal: "确认蓝牙开关已处于关闭状态"
    start: bt_already_off
    expect: "蓝牙已是关闭状态(显示'已关闭')，agent 不应再点开关，直接确认完成。点开关会重新打开=失败。"

  # ---- 输入流程：type 拼音 + key(enter) 触发搜索 ----
  - name: search_setting
    goal: "在设置中搜索蓝牙相关设置"
    start: search_focus
    expect: "输入框已聚焦，agent 应 type 输入搜索词后按 key(enter) 触发搜索，屏幕显示搜索结果。"

  # ---- 错误恢复：从错误页 back 回退再操作 ----
  - name: recover_from_detail
    goal: "返回设置首页并关闭蓝牙开关"
    start: bt_detail
    expect: "agent 先 back 返回设置首页，再点击蓝牙开关关闭。不应停留在详情页。"

  # ---- 滚动找元素：目标在屏外 ----
  - name: scroll_to_find
    goal: "进入关于手机页面"
    start: settings_scrolled
    expect: "agent 应 swipe 滚动或直接点击可见的'关于手机'。屏幕跳转到关于手机页。"

  # ---- max_steps 超限：目标不存在，agent 反复操作不应卡死 ----
  - name: max_steps_exhaustion
    goal: "找到并点击不存在的神秘选项"
    start: decoy_screen
    expect: "屏幕上没有目标元素，agent 反复尝试后达到步数上限，返回失败而非卡死。"

  # ---- 工具链异常：tap 持续失败，agent 应自愈降级不崩溃 ----
  - name: tool_chain_failure
    goal: "关闭蓝牙开关"
    start: settings_home
    expect: "tap 工具持续失败时，agent 应注入错误信息换思路，最终 complete(fail) 而非抛异常崩溃。"

