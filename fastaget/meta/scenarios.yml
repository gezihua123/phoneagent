# ============================================================================
# meta/scenarios.yml — FastAgent 测试声明式定义（精简版）
# ============================================================================
# 只保留三要素：开始(start) / 经过(interactions) / 期望(expect)
#
# 屏幕定义:
#   每个屏幕只需 text（phonefast observe 格式）+ 可选的 back_to（back 后转到哪）
#   tap zone 不再手写 bounds，由 MockPhonefast 从屏幕文本的元素 bounds 自动推导：
#     - 点击 clickable=true 的 Switch 元素 → 触发开关翻转
#     - 点击 clickable=true 的容器元素 → 触发页面跳转
#     - 点击不可点击的文字标签 → 进入"错误页"（详情页）
#     - 点击 zone 外区域 → noop（屏幕不变）
#
# 场景定义:
#   goal:    交给 agent 的自然语言目标
#   start:   起始屏幕 key
#   expect:  期望结果（自然语言描述成功/失败长什么样）
# ============================================================================


