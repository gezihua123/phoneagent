# meta/credentials.yml — 凭证定义（脱敏注入，值永不出现在 LLM prompt/历史中）
#
# 格式：
#   secrets:
#     <SECRET_ID>:
#       value: "<actual secret>"
#       enabled: true           # false 则跳过
#     <SHORT_ID>: "<value>"     # 简写，自动 enabled
#
# LLM 通过 type_secret(secret_id="WIFI_PASSWORD") 引用，
# 实际值在工具执行时由 CredentialManager 解析，不进上下文。
#
# 安全提示：此文件应加入 .gitignore，避免凭证泄漏。

secrets:
  # 示例（取消注释并替换为实际值）：
  # WIFI_PASSWORD:
  #   value: "MyWiFi123"
  #   enabled: false
  # DEVICE_PIN:
  #   value: "123456"
