- goal: Add the expenses from expenses.jpg in Simple Gallery Pro to pro expense.
  initialize:
  - command: sqlite3 /data/data/com.arduia.expense/databases/accounting.db "DELETE
      FROM expense;"
  - command: 'echo ''expenses_placeholder Dinner Out 42.00

      Coffee 4.00

      Taxi Ride 25.00'' > /sdcard/DCIM/expenses.jpg 2>/dev/null || true'
