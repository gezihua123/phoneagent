cases:
- goal: 'Add the following expenses into the arduia pro expense: Lunch 15.50, Coffee
    4.00'
  initialize:
  - command: sqlite3 /data/data/com.arduia.expense/databases/accounting.db "CREATE
      TABLE IF NOT EXISTS expense (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT,
      amount INTEGER, category INTEGER, note TEXT, created_date INTEGER, modified_date
      INTEGER);" 2>/dev/null || true
  - command: sqlite3 /data/data/com.arduia.expense/databases/accounting.db "DELETE
      FROM expense;"
  - command: sqlite3 /data/data/com.arduia.expense/databases/accounting.db "INSERT
      INTO expense(name,amount,category,note,created_date,modified_date) VALUES('Coffee',400,4,'Morning
      coffee',1697385600000,1697385600000);"
  - command: sqlite3 /data/data/com.arduia.expense/databases/accounting.db "INSERT
      INTO expense(name,amount,category,note,created_date,modified_date) VALUES('Taxi
      Ride',2500,7,'Airport transfer',1697385600000,1697385600000);"
  - command: sqlite3 /data/data/com.arduia.expense/databases/accounting.db "INSERT
      INTO expense(name,amount,category,note,created_date,modified_date) VALUES('Dinner
      Out',4200,3,'Date night',1697385600000,1697385600000);"
  - command: sqlite3 /data/data/com.arduia.expense/databases/accounting.db "INSERT
      INTO expense(name,amount,category,note,created_date,modified_date) VALUES('Groceries',8950,3,'Weekly
      shopping',1697385600000,1697385600000);"
