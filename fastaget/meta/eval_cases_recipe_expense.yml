- goal: Go through the transactions in my_expenses.txt in Markor. Log the reimbursable
    transactions in the arduia pro expense.
  initialize:
  - command: sqlite3 /data/data/com.arduia.expense/databases/accounting.db "DELETE
      FROM expense;"
  - command: 'echo ''Dinner Out,42.00,Restaurant,Reimbursable. Date night

      Taxi Ride,25.00,Transportation,Reimbursable. Airport transfer

      '' > /sdcard/Documents/Markor/my_expenses.txt 2>/dev/null || true'
  - command: pm grant net.gsantner.markor android.permission.WRITE_EXTERNAL_STORAGE
      2>/dev/null || true
  max_steps: 30
  name: AW-ExpenseAddMultipleFromMarkor
  tags:
  - H
  - expense
  - T4
  verify:
  - command: sqlite3 /data/data/com.arduia.expense/databases/accounting.db "SELECT
      COUNT(*) FROM expense;"
    expect_re: '[1-9][0-9]*'
