- goal: 'Transcribe the contents of video test_video.mp4 by watching it in VLC player
    (located in Download) and writing the sequence of strings shown on each frame
    to the text file test_note_ozfg.md in Markor as a comma separated list. For example,
    if the first frame shows the text "edna" and the second frame shows the text "pineapple",
    then the text file should contains only the following text: "edna, pineapple".'
  initialize:
  - command: rm -f /sdcard/Documents/Markor/test_note_ozfg.md 2>/dev/null || true
  - command: pm grant net.gsantner.markor android.permission.WRITE_EXTERNAL_STORAGE
      2>/dev/null || true
  - command: mkdir -p /sdcard/Documents/Markor 2>/dev/null || true
  - command: adb push fastaget/meta/assets/test_video.mp4 /sdcard/Download/test_video.mp4
  - command: adb push fastaget/meta/assets/noise_video_1.mp4 /sdcard/Download/noise_video_1.mp4
  - command: adb push fastaget/meta/assets/noise_video_2.mp4 /sdcard/Download/noise_video_2.mp4
  - command: adb push fastaget/meta/assets/noise_video_3.mp4 /sdcard/Download/noise_video_3.mp4
  max_steps: 35
  name: AW-MarkorTranscribeVideo
  tags:
  - H
  - markor
  - T5
  verify:
  - command: cat /sdcard/Documents/Markor/test_note_ozfg.md 2>/dev/null
    expect_re: ^Alice[\s\S]*Ava[\s\S]*Isabella$
