- goal: 'Create a playlist titled "Test Playlist wjj" with the following files in
    VLC (located in Internal Memory/VLCVideos), in order: {files}'
  max_steps: 25
  name: AW-VlcCreatePlaylist
  tags:
  - M
  - vlc
  - T4
  verify:
  - command: sqlite3_cat:/data/data/org.videolan.vlc/app_db/vlc_media.db::SELECT Media.filename
      FROM PlaylistMediaRelation INNER JOIN Playlist ON Playlist.id_playlist = PlaylistMediaRelation.playlist_id
      INNER JOIN Media ON Media.id_media = PlaylistMediaRelation.media_id WHERE Playlist.name
      = 'Test Playlist wjj' ORDER BY PlaylistMediaRelation.position;
    expect_re: ^[^\n]*test_video_1\.mp4[^\n]*\n[^\n]*test_video_2\.mp4[^\n]*\n[^\n]*test_video_3\.mp4[^\n]*$
  initialize:
  - command: am force-stop org.videolan.vlc 2>/dev/null || true
  - command: rm -f /data/data/org.videolan.vlc/app_db/vlc_media.db 2>/dev/null ||
      true
  - command: mkdir -p /sdcard/VLCVideos 2>/dev/null || true
  - command: rm -f /sdcard/VLCVideos/*.mp4 2>/dev/null || true
  - command: adb push fastaget/meta/assets/test_video_1.mp4 /sdcard/VLCVideos/test_video_1.mp4
  - command: adb push fastaget/meta/assets/test_video_2.mp4 /sdcard/VLCVideos/test_video_2.mp4
  - command: adb push fastaget/meta/assets/test_video_3.mp4 /sdcard/VLCVideos/test_video_3.mp4
  - command: adb push fastaget/meta/assets/other_video_1.mp4 /sdcard/VLCVideos/other_video_1.mp4
  - command: adb push fastaget/meta/assets/other_video_2.mp4 /sdcard/VLCVideos/other_video_2.mp4
